<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lockbox — private notes</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         background: #0d1117; color: #c9d1d9; display: grid; place-items: center;
         min-height: 100vh; }
  main { width: min(560px, 92vw); padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #8b949e; margin: 0 0 20px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
          padding: 16px; margin: 12px 0; }
  label { display: block; color: #8b949e; margin: 8px 0 2px; }
  input { width: 100%; box-sizing: border-box; background: #0d1117; color: #c9d1d9;
          border: 1px solid #30363d; border-radius: 6px; padding: 8px; font: inherit; }
  button { margin-top: 12px; background: #238636; color: #fff; border: 0;
           border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.ghost { background: #21262d; border: 1px solid #30363d; }
  .note { border-left: 3px solid #388bfd; padding-left: 10px; margin: 10px 0; }
  .note h3 { margin: 0; font-size: 14px; }
  .note p { margin: 2px 0 0; color: #adbac7; white-space: pre-wrap; }
  .err { color: #f85149; }
  .hint { color: #6e7681; font-size: 13px; }
  code { color: #d2a8ff; }
</style>
</head>
<body>
<main>
  <h1>🔒 Lockbox</h1>
  <p class="sub">Your private notes, safe behind a login.</p>

  <section id="loginCard" class="card">
    <strong>Sign in</strong>
    <label>username</label>
    <input id="user" value="bob" autocomplete="off" />
    <label>password</label>
    <input id="pass" type="password" value="hunter2" />
    <button id="loginBtn">Sign in</button>
    <p class="hint">Test account is pre-filled. (bob / hunter2)</p>
    <p id="loginErr" class="err"></p>
  </section>

  <section id="appCard" class="card" hidden>
    <strong>Signed in as <span id="who"></span></strong>
    <div id="myNotes"></div>
    <hr style="border-color:#30363d" />
    <label>Open note by number</label>
    <input id="noteId" value="3" inputmode="numeric" />
    <button id="viewBtn" class="ghost">Open</button>
    <div id="viewer"></div>
  </section>
</main>

<script>
let token = null;

async function api(path, opts = {}) {
  const headers = Object.assign({ 'content-type': 'application/json' }, opts.headers || {});
  if (token) headers['authorization'] = 'Bearer ' + token;
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  return { ok: res.ok, status: res.status, data: await res.json().catch(() => ({})) };
}

document.getElementById('loginBtn').onclick = async () => {
  const err = document.getElementById('loginErr');
  err.textContent = '';
  const r = await api('/api/login', {
    method: 'POST',
    body: JSON.stringify({
      user: document.getElementById('user').value,
      password: document.getElementById('pass').value,
    }),
  });
  if (!r.ok) { err.textContent = r.data.error || 'login failed'; return; }
  token = r.data.token;
  document.getElementById('loginCard').hidden = true;
  document.getElementById('appCard').hidden = false;
  loadMine();
};

async function loadMine() {
  const r = await api('/api/mynotes');
  document.getElementById('who').textContent = r.data.user || '?';
  const box = document.getElementById('myNotes');
  box.innerHTML = '<p class="hint">Your notes:</p>' + (r.data.notes || [])
    .map((n) => `<div class="note"><h3>#${n.id} — ${n.title}</h3></div>`).join('');
}

document.getElementById('viewBtn').onclick = async () => {
  const id = document.getElementById('noteId').value;
  const r = await api('/api/note?id=' + encodeURIComponent(id));
  const v = document.getElementById('viewer');
  if (!r.ok) { v.innerHTML = `<p class="err">${r.data.error || 'error'}</p>`; return; }
  v.innerHTML = `<div class="note"><h3>#${r.data.id} — ${r.data.title}
    <span class="hint">(owner: ${r.data.owner})</span></h3><p>${r.data.body}</p></div>`;
};
</script>
</body>
</html>
